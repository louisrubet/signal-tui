[package]
name = "signal-tui"
version = "1.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
crossterm = { version = "0.28", features = ["event-stream"] }
chrono = "0.4"
futures = "0.3"
# Fork of whisperfish/presage, branch storage-groups: adds Manager::sync_groups_from_storage_service.
presage = { git = "https://github.com/louisrubet/presage", rev = "85ff409f7c5b8cec91ba531a9c2b0a0e1687f43d" }
presage-store-sqlite = { git = "https://github.com/louisrubet/presage", rev = "85ff409f7c5b8cec91ba531a9c2b0a0e1687f43d" }
tokio = { version = "1.48", features = ["macros", "rt", "time"] }
url = "2.5"
base64 = "0.22"
open = "5.3"
notify-rust = "4.18"
unicode-width = "0.2"
# Store encryption: key in the OS keyring, passphrase prompt as a fallback.
keyring = "4.2"
rpassword = "7.5"
rand = "0.9"
# Same sqlx (and SQLCipher) as presage-store-sqlite, to encrypt an existing plain store.
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
# :shortcode: to emoji table (tip of main).
emoji-expander = { git = "https://github.com/louisrubet/emoji-expander", tag = "v1.2.0" }
qrcode = { version = "0.14", default-features = false }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.9"

# Same patch as the presage workspace: presage-store-sqlite needs this libsqlite3-sys fork for SQLCipher.
[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }
