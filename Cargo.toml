[package]
name = "signal-tui"
version = "1.4.0"
edition = "2024"
license = "AGPL-3.0-only"
build = "build.rs"

[dependencies]
# The interface, shared with google-messages-tui.
chat-tui = { git = "https://github.com/louisrubet/chat-tui", tag = "v1.0.0" }
chrono = "0.4"
futures = "0.3"
# Fork of whisperfish/presage, branch storage-groups: adds Manager::sync_groups_from_storage_service.
presage = { git = "https://github.com/louisrubet/presage", rev = "2fc7af9c3b9c5e2baacd60784a450d352daa2fc7" }
presage-store-sqlite = { git = "https://github.com/louisrubet/presage", rev = "2fc7af9c3b9c5e2baacd60784a450d352daa2fc7" }
tokio = { version = "1.48", features = ["macros", "rt", "time"] }
url = "2.5"
# Store encryption: key in the OS keyring, passphrase prompt as a fallback.
keyring = "4.2"
rpassword = "7.5"
rand = "0.9"
# Same sqlx (and SQLCipher) as presage-store-sqlite, to encrypt an existing plain store.
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.9"

# Same patch as the presage workspace: presage-store-sqlite needs this libsqlite3-sys fork for SQLCipher.
[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# Fork of whisperfish/libsignal-service-rs at presage's revision, with the first keepalive
# delayed: Signal-Server closes sockets that send one before the device is present.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { git = "https://github.com/louisrubet/libsignal-service-rs", rev = "7e455b6e2955e7aa611bedfd127fcc41c2ad09c4" }
